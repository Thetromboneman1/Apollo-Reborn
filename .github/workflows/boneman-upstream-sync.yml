name: Boneman Upstream Sync

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: boneman-apollo-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Apollo-Reborn/Apollo-Reborn
  DOWNSTREAM_BRANCH: main

jobs:
  sync:
    if: github.repository == 'Thetromboneman1/Apollo-Reborn'
    runs-on: macos-15
    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Merge upstream into review branch
        id: upstream
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune upstream main
          upstream_sha=$(git rev-parse upstream/main)
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/upstream-sync-${upstream_sha:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch --force-create "$branch" FETCH_HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Refresh generated documentation
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/documentation_health.py --write
          python3 scripts/documentation_health.py --check
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "docs: refresh generated repository state"
          fi
      - name: Install build dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: brew install ldid dpkg make
      - name: Add GNU Make to PATH
        if: steps.upstream.outputs.changed == 'true'
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Check out Theos
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275 # master @ 2026-04-09
          path: theos
          submodules: recursive
      - name: Select Xcode 26.0.1
        if: steps.upstream.outputs.changed == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Validate preserved downstream behavior
        if: steps.upstream.outputs.changed == 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
        run: scripts/validate-downstream.sh --build
      - name: Push review branch and open pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git push --set-upstream origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --base "$DOWNSTREAM_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$existing" ]]; then
            gh pr create --head "$BRANCH" --base "$DOWNSTREAM_BRANCH" \
              --title "chore: sync Apollo-Reborn/Apollo-Reborn main" \
              --body "Merges \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\` through the downstream package validation contract."
          fi
