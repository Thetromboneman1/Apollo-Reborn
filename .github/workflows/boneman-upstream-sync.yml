name: Boneman Upstream Sync

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: boneman-apollo-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Apollo-Reborn/Apollo-Reborn

jobs:
  sync:
    if: github.repository == 'Thetromboneman1/Apollo-Reborn'
    runs-on: macos-15
    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream into fork main
        id: upstream
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune upstream main
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a merge conflict
        if: steps.upstream.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Apollo upstream sync conflict"
          body="The bounded upstream sync stopped without pushing a conflicted merge. Review: $RUN_URL"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
