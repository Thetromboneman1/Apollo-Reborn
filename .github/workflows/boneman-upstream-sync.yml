name: Boneman Upstream Sync

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boneman-apollo-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Apollo-Reborn/Apollo-Reborn

jobs:
  sync:
    if: github.repository == 'Thetromboneman1/Apollo-Reborn'
    runs-on: macos-15
    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream into fork main
        id: upstream
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune upstream main
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a merge conflict
        if: steps.upstream.outputs.conflict == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error title=Apollo upstream sync conflict::The bounded upstream sync stopped without pushing a conflicted merge. Review: $RUN_URL"
          {
            echo "## Apollo upstream sync conflict"
            echo
            echo "The bounded upstream sync stopped without pushing a conflicted merge."
            echo
            echo "Review: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
