name: Repository Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "img/**"
      - ".github/pr-assets/**"
      - ".github/images/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "img/**"
      - ".github/pr-assets/**"
      - ".github/images/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR or branch supersedes an in-flight build.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install ldid dpkg make
      - name: Add GNU Make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Restore cached Theos
        id: theos_cache
        # Keyed on the pinned commit, so a hit is byte-for-byte that checkout.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: theos
          key: theos-9bc73406cf80b711ef4d02c15ff1dedc4478a275-recursive

      - name: Check out Theos
        if: steps.theos_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275 # master @ 2026-04-09
          path: theos
          submodules: recursive
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Validate and rebuild downstream package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: scripts/validate-downstream.sh --build
