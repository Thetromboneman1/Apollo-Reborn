name: Build IPA

# Build a sideload-ready Apollo IPA on GitHub Actions. Optionally injects the
# tweak (inject_tweak / no_extensions) and applies patch.sh patches
# (liquid_glass, liquid_glass_icons, url_schemes, remove_code_signature).
# Extension-bearing builds always get the manual + legacy Safari overlays
# (patch.sh --fix-safari-extension).
#
# IMPORTANT: The Apollo IPA you provide MUST be DECRYPTED. App Store IPAs are
# FairPlay-encrypted and will crash on launch after injection/patching.

on:
  workflow_dispatch:
    inputs:
      apollo_ipa_url:
        description: 'Direct URL to a decrypted Apollo IPA or prepared Apollo base IPA'
        required: true
        type: string
        default: 'https://downloads.apolloreborn.app/apollobase.ipa'
      apollo_ipa_sha256:
        description: 'SHA-256 of that IPA (required unless it is the pinned default in distribution/base-ipa.sha256)'
        required: false
        type: string
        default: ''
      inject_tweak:
        description: 'Build and inject the Apollo-Reborn tweak'
        required: false
        type: boolean
        default: true
      no_extensions:
        description: 'Strip app extensions during injection (requires inject_tweak)'
        required: false
        type: boolean
        default: false
      liquid_glass:
        description: 'Liquid Glass: full iOS 26 UI redesign + icon pack'
        required: false
        type: boolean
        default: true
      liquid_glass_icons:
        description: 'Liquid Glass: icon pack only (keeps classic UI). Mutually exclusive with above option.'
        required: false
        type: boolean
        default: false
      url_schemes:
        description: 'Comma-separated URL schemes to add'
        required: false
        type: string
        default: 'dystopia,redreader'
      remove_code_signature:
        description: 'Remove code signature'
        required: false
        type: boolean
        default: false
      output_name:
        description: 'Output IPA filename (without .ipa extension)'
        required: false
        type: string
        default: 'Apollo-Reborn'
      create_release:
        description: 'Also publish the IPA as a draft GitHub release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    # Dispatch inputs reach shell only through these variables, never as
    # ${{ }} text spliced into a script.
    env:
      IN_INJECT_TWEAK: ${{ inputs.inject_tweak }}
      IN_NO_EXTENSIONS: ${{ inputs.no_extensions }}
      IN_LIQUID_GLASS: ${{ inputs.liquid_glass }}
      IN_LIQUID_GLASS_ICONS: ${{ inputs.liquid_glass_icons }}
      IN_URL_SCHEMES: ${{ inputs.url_schemes }}
      IN_REMOVE_CODE_SIGNATURE: ${{ inputs.remove_code_signature }}
      IN_OUTPUT_NAME: ${{ inputs.output_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Validate inputs
        run: |
          if [ "${IN_LIQUID_GLASS}" == "true" ] && [ "${IN_LIQUID_GLASS_ICONS}" == "true" ]; then
            echo "Error: 'liquid_glass' and 'liquid_glass_icons' are mutually exclusive."
            exit 1
          fi
          if [ "${IN_NO_EXTENSIONS}" == "true" ] && [ "${IN_INJECT_TWEAK}" != "true" ]; then
            echo "Error: 'no_extensions' only applies when 'inject_tweak' is enabled."
            exit 1
          fi

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install ldid dpkg make

      - name: Add GNU make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        if: inputs.inject_tweak
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275 # master @ 2026-04-09
          path: theos
          submodules: recursive

      # This Xcode supplies the Makefile's pinned iOS 26.0 release SDK.
      - name: Select Xcode 26.0.1
        if: inputs.inject_tweak
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Build rootful tweak package
        if: inputs.inject_tweak
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Locate built .deb
        if: inputs.inject_tweak
        id: locate_deb
        run: |
          DEB_PATH=$(ls -1t packages/*.deb | head -1)
          if [ -z "$DEB_PATH" ]; then
            echo "Error: no .deb produced by make package"
            exit 1
          fi
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "Built tweak: $DEB_PATH"

      - name: Collect debug symbols
        if: inputs.inject_tweak
        run: bash ./scripts/collect-debug-symbols.sh --label rootful --output-dir ./dist/symbols

      - name: Install cyan injector
        if: inputs.inject_tweak
        run: |
          # cyan (pyzule-rw) injector; not the unrelated PyPI "cyan". A venv is
          # needed because the runner's Homebrew Python is PEP 668 externally
          # managed. Used directly for no-extensions and as build-ipa.sh fallback.
          python3 -m venv "$RUNNER_TEMP/cyan-venv"
          "$RUNNER_TEMP/cyan-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cyan-venv/bin/python" -m pip install \
            "https://github.com/asdfzxcvbn/pyzule-rw/archive/04a40f2aa65ec9cb36127f74d52ae4ef71377c50.zip" # v1.4.4
          echo "$RUNNER_TEMP/cyan-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cyan-venv/bin/cyan" --help >/dev/null
          echo "cyan installed: $RUNNER_TEMP/cyan-venv/bin/cyan"

      - name: Install xcodegen
        # Only the with-extensions path injects widgets (below), so xcodegen is
        # only needed when injecting a tweak without the no-extensions flag.
        if: inputs.inject_tweak && github.event.inputs.no_extensions != 'true'
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Download Apollo IPA
        env:
          APOLLO_IPA_URL: ${{ inputs.apollo_ipa_url }}
          APOLLO_IPA_SHA256: ${{ inputs.apollo_ipa_sha256 }}
          # Manual test builds may use an unpinned IPA (with a warning);
          # release and PR builds may not.
          ALLOW_UNPINNED_BASE_IPA: '1'
        run: |
          curl -L --fail --retry 3 "$APOLLO_IPA_URL" -o Apollo.ipa
          bash ./scripts/verify-base-ipa.sh Apollo.ipa "$APOLLO_IPA_URL" "$APOLLO_IPA_SHA256"
          unzip -t Apollo.ipa >/dev/null
          echo "Apollo.ipa size: $(wc -c < Apollo.ipa) bytes"

      - name: Inject tweak
        if: inputs.inject_tweak
        env:
          DEB_PATH: ${{ steps.locate_deb.outputs.deb_path }}
        run: |
          DEB="$DEB_PATH"
          if [ "${IN_NO_EXTENSIONS}" == "true" ]; then
            echo "Injecting tweak (no extensions) with cyan..."
            cyan -i Apollo.ipa -f "$DEB" -o injected.ipa -e
            python3 scripts/register-backup-document.py injected.ipa
          else
            echo "Injecting tweak with build-ipa.sh..."
            chmod +x ./build-ipa.sh
            bash ./build-ipa.sh --ipa Apollo.ipa --deb "$DEB" -o injected.ipa
            # With-extensions build → include the Reborn widget extension too.
            echo "Injecting Reborn widgets..."
            bash ./scripts/inject-widgets.sh --ipa injected.ipa --build -o injected-ww.ipa
            mv -f injected-ww.ipa injected.ipa
          fi
          if [ ! -f injected.ipa ]; then
            echo "Error: injection did not produce injected.ipa"
            exit 1
          fi
          # Continue the pipeline from the injected IPA.
          mv -f injected.ipa Apollo.ipa
          echo "Injected Apollo.ipa size: $(wc -c < Apollo.ipa) bytes"

      - name: Collect widget debug symbols
        if: inputs.inject_tweak && github.event.inputs.no_extensions != 'true'
        run: |
          WIDGET_DSYM="widgets/build/Build/Products/Release-iphoneos/ApolloRebornWidgets.appex.dSYM"
          if [ ! -d "$WIDGET_DSYM" ]; then
            echo "Error: missing widget dSYM: $WIDGET_DSYM" >&2
            exit 1
          fi
          mkdir -p ./dist/symbols/widgets
          cp -R "$WIDGET_DSYM" ./dist/symbols/widgets/

      - name: Archive debug symbols
        if: inputs.inject_tweak
        id: symbols
        run: |
          SYMBOLS_ZIP="Apollo-Reborn-dSYMs-${{ github.run_number }}.zip"
          (cd dist && zip -qry "../${SYMBOLS_ZIP}" symbols)
          echo "symbols_zip=${SYMBOLS_ZIP}" >> "$GITHUB_OUTPUT"
          echo "Debug symbols: ${SYMBOLS_ZIP} ($(wc -c < "${SYMBOLS_ZIP}") bytes)"

      - name: Build output filename
        id: outname
        run: |
          BASE="${IN_OUTPUT_NAME}"
          [ -z "$BASE" ] && BASE="Apollo-Reborn"
          if [[ ! "$BASE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid output_name::Use letters, digits, '.', '_' or '-' only."
            exit 1
          fi
          SUFFIX=""
          if [ "${IN_NO_EXTENSIONS}" == "true" ]; then
            SUFFIX="${SUFFIX}-NoExt"
          fi
          if [ "${IN_LIQUID_GLASS}" == "true" ]; then
            SUFFIX="${SUFFIX}-LiquidGlass"
          fi
          if [ "${IN_LIQUID_GLASS_ICONS}" == "true" ]; then
            SUFFIX="${SUFFIX}-LiquidGlassIcons"
          fi
          if [ -n "${IN_URL_SCHEMES}" ] && [ "${IN_URL_SCHEMES}" != "dystopia,redreader" ]; then
            SUFFIX="${SUFFIX}-URLSchemes"
          fi
          OUTPUT_IPA="${BASE}${SUFFIX}.ipa"
          echo "output_ipa=${OUTPUT_IPA}" >> "$GITHUB_OUTPUT"
          echo "Output filename: ${OUTPUT_IPA}"

      - name: Apply patches
        id: patch
        env:
          OUTPUT_IPA: ${{ steps.outname.outputs.output_ipa }}
        run: |
          NEEDS_PATCH="false"
          PATCH_ARGS=(Apollo.ipa -o "$OUTPUT_IPA")
          if [ "${IN_LIQUID_GLASS}" == "true" ]; then
            PATCH_ARGS+=(--liquid-glass)
            NEEDS_PATCH="true"
          fi
          if [ "${IN_LIQUID_GLASS_ICONS}" == "true" ]; then
            PATCH_ARGS+=(--liquid-glass-icons)
            NEEDS_PATCH="true"
          fi
          if [ -n "${IN_URL_SCHEMES}" ]; then
            PATCH_ARGS+=(--url-schemes "${IN_URL_SCHEMES}")
            NEEDS_PATCH="true"
          fi
          if [ "${IN_REMOVE_CODE_SIGNATURE}" == "true" ]; then
            PATCH_ARGS+=(--remove-code-signature)
            NEEDS_PATCH="true"
          fi
          # Package the passive manual fallback and the separately labelled,
          # opt-in legacy automatic opener whenever extensions are retained.
          if [ "${IN_NO_EXTENSIONS}" != "true" ]; then
            PATCH_ARGS+=(--fix-safari-extension)
            NEEDS_PATCH="true"
          fi

          if [ "$NEEDS_PATCH" == "true" ]; then
            echo "Running: ./patch.sh ${PATCH_ARGS[*]}"
            chmod +x ./patch.sh
            ./patch.sh "${PATCH_ARGS[@]}"
          else
            # No patch options selected: the (possibly injected) IPA is the output.
            echo "No patch options selected; using IPA as-is."
            mv -f Apollo.ipa "$OUTPUT_IPA"
          fi

          if [ ! -f "$OUTPUT_IPA" ]; then
            echo "Error: expected output $OUTPUT_IPA was not produced."
            ls -la
            exit 1
          fi
          echo "output_ipa=${OUTPUT_IPA}" >> "$GITHUB_OUTPUT"
          echo "Final IPA: ${OUTPUT_IPA} ($(wc -c < "$OUTPUT_IPA") bytes)"

      - name: Validate output IPA
        if: inputs.inject_tweak
        env:
          IPA: ${{ steps.patch.outputs.output_ipa }}
        run: |
          if [ "${IN_NO_EXTENSIONS}" == "true" ]; then
            if unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/'; then
              echo "Error: no-extensions output contains app extensions:" >&2
              unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/' >&2
              exit 1
            fi
          else
            if ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/PlugIns/Apollofari\.appex/'; then
              echo "Error: output IPA is missing the manual Safari extension" >&2
              exit 1
            fi
            if ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/PlugIns/ApollofariLegacy\.appex/'; then
              echo "Error: output IPA is missing the legacy Safari extension" >&2
              exit 1
            fi
            if ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/PlugIns/ApolloRebornWidgets\.appex/'; then
              echo "Error: output IPA is missing ApolloRebornWidgets.appex" >&2
              exit 1
            fi
            if unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/PlugIns/AthenaWidgetExtension\.appex/'; then
              echo "Error: output IPA still contains stock AthenaWidgetExtension.appex" >&2
              exit 1
            fi
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.patch.outputs.output_ipa }}
          path: ${{ steps.patch.outputs.output_ipa }}
          retention-days: 30

      - name: Upload debug symbols artifact
        if: inputs.inject_tweak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.symbols.outputs.symbols_zip }}
          path: ${{ steps.symbols.outputs.symbols_zip }}
          retention-days: 30

      - name: Create release
        if: inputs.create_release && inputs.inject_tweak
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          draft: true
          tag_name: build-ipa-${{ github.run_number }}
          name: Apollo build ${{ github.run_number }}
          files: |
            ${{ steps.patch.outputs.output_ipa }}
            ${{ steps.symbols.outputs.symbols_zip }}
          prerelease: false

      - name: Create release without tweak symbols
        if: inputs.create_release && !inputs.inject_tweak
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          draft: true
          tag_name: build-ipa-${{ github.run_number }}
          name: Apollo build ${{ github.run_number }}
          files: |
            ${{ steps.patch.outputs.output_ipa }}
          prerelease: false
