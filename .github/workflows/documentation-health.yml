name: Documentation health

on:
  # Branch-only self-heal (fleet documentation contract). A self-heal commit is
  # pushed with GITHUB_TOKEN, which does not trigger workflows, so regenerate
  # docs before pushing to keep PR heads checked (see AGENTS.md).
  push:
    branches:
      - "**"
  pull_request:

# Read-only by default; only the push job below may commit, and only the
# generated documentation paths.
permissions:
  contents: read

concurrency:
  group: documentation-health-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-health:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install SVG renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Refresh generated documentation
        run: python3 scripts/documentation_health.py --write
      - name: Verify documentation and rendered diagrams
        run: python3 scripts/documentation_health.py --check
      - name: Require generated files in pull requests
        run: |
          git diff --check
          if git status --porcelain | grep -q .; then
            git status --short
            echo "::error title=Generated documentation is stale::Run 'python3 scripts/documentation_health.py --write' and commit README.md and docs/."
            exit 1
          fi

  # Same job name on push so existing required checks keep matching.
  self-heal:
    name: documentation-health
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit regenerated README.md / docs/
    env:
      REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install SVG renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Refresh generated documentation
        run: python3 scripts/documentation_health.py --write
      - name: Verify documentation and rendered diagrams
        run: python3 scripts/documentation_health.py --check
      - name: Commit self-healed documentation
        run: |
          if ! git status --porcelain | grep -q .; then
            exit 0
          fi
          # The generator only owns README.md and docs/. Anything else that
          # changed is unexpected; fail instead of committing it.
          unexpected=$(git status --porcelain | sed -E 's/^.{3}//' | grep -Ev '^(README\.md|docs/)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error title=Unexpected generated changes::${unexpected//$'\n'/, }"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "docs: refresh generated repository state [skip ci]"
          git push
